name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and publish MkDocs site
    runs-on: ubuntu-latest
    steps:
      # persist-credentials must stay on: `mkdocs gh-deploy` uses the checkout
      # credential to push the built site to the gh-pages branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4  # zizmor: ignore[artipacked]

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync docs dependencies
        run: uv sync --frozen --group docs

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
